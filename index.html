<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herio AI · Assistant WhatsApp</title>
<meta name="description" content="Assistant WhatsApp intelligent : réponses 24/7, envoi de produits, localisation, gestion des clients. Herio AI.">
<style>
:root{--g1:#0b6b2c;--g2:#13a23f;--g3:#25d366;--dark:#06280f;--mint:#eafbef;--mint2:#d6f5df;--ink:#0d1f14;--muted:#4a6355;--white:#fff;--gold:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4fff7,#fff 40%);line-height:1.6;overflow-x:hidden}
[dir=rtl] body{font-family:Tahoma,'Segoe UI',Arial,sans-serif}
a{text-decoration:none;color:inherit}
.wrap{max-width:1150px;margin:auto;padding:0 18px}
section{padding:70px 0}
h2{font-size:clamp(1.6rem,4vw,2.4rem);color:var(--dark);text-align:center;margin-bottom:10px}
.sub{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 38px}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--mint2)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--g1);font-size:1.15rem}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--g2),var(--g3));display:grid;place-items:center;color:#fff;font-style:normal}
nav.links{display:flex;gap:20px;font-weight:600;font-size:.92rem}
nav.links a:hover{color:var(--g2)}
.right{display:flex;align-items:center;gap:8px}
.lang{display:flex;gap:4px}
.lang button{border:2px solid transparent;background:none;border-radius:6px;padding:2px;cursor:pointer;line-height:0}
.lang button.on{border-color:var(--g3)}
.lang img{width:26px;height:18px;border-radius:3px;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:50px;font-weight:700;border:0;cursor:pointer;font-size:1rem;transition:.25s}
.btn-g{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 22px rgba(19,162,63,.35)}
.btn-g:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(19,162,63,.5)}
.btn-o{background:#fff;color:var(--g1);border:2px solid var(--g2)}
.btn-o:hover{background:var(--mint)}
.btn.sm{padding:9px 18px;font-size:.88rem}
@media(max-width:860px){nav.links{display:none}}
/* hero */
.hero{background:radial-gradient(circle at 80% 20%,var(--mint2),transparent 55%),linear-gradient(180deg,#f0fff4,#fff);position:relative;overflow:hidden;padding:60px 0 80px}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-120px;height:200px;background:linear-gradient(90deg,var(--g1),var(--g3));border-radius:50% 50% 0 0;opacity:.12}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.badge{display:inline-block;background:var(--mint2);color:var(--g1);font-weight:700;padding:6px 16px;border-radius:30px;font-size:.85rem;margin-bottom:16px}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.15;color:var(--dark);margin-bottom:16px}
.hero h1 span{background:linear-gradient(90deg,var(--g1),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:1.1rem;margin-bottom:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.stats b{display:block;font-size:1.8rem;color:var(--g1)}
.stats small{color:var(--muted)}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;text-align:center}.cta,.stats{justify-content:center}}
/* phone */
.phone{width:280px;margin:auto;background:#111;border-radius:36px;padding:10px;box-shadow:0 30px 60px rgba(6,40,15,.35);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.screen{background:#e5ddd5;border-radius:28px;overflow:hidden;height:440px;display:flex;flex-direction:column}
.ph-top{background:var(--g1);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
.ph-top i{width:30px;height:30px;border-radius:50%;background:var(--g3);display:grid;place-items:center;font-style:normal}
.ph-top small{display:block;font-weight:400;font-size:.7rem;opacity:.85}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.m{max-width:80%;padding:8px 12px;border-radius:12px;font-size:.82rem;opacity:0;transform:translateY(10px);animation:in .5s forwards;color:#111}
.m.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.m.out{background:#dcf8c6;align-self:flex-end;border-top-right-radius:2px}
[dir=rtl] .m.in{align-self:flex-end}[dir=rtl] .m.out{align-self:flex-start}
@keyframes in{to{opacity:1;transform:none}}
/* features */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--mint2);border-radius:20px;padding:26px;transition:.3s;box-shadow:0 6px 18px rgba(11,107,44,.06)}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(11,107,44,.18);border-color:var(--g3)}
.ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--g1),var(--g3));display:grid;place-items:center;font-size:1.6rem;margin-bottom:14px}
.card h3{color:var(--dark);margin-bottom:6px}
.card p{color:var(--muted);font-size:.95rem}
/* steps */
.band{background:linear-gradient(135deg,var(--dark),var(--g1));color:#fff}
.band h2{color:#fff}.band .sub{color:#c9ecd5}
.step{text-align:center;padding:10px}
.num{width:60px;height:60px;border-radius:50%;background:var(--g3);color:var(--dark);font-weight:800;font-size:1.5rem;display:grid;place-items:center;margin:0 auto 12px}
.step p{color:#c9ecd5}
/* offer */
.offer{max-width:560px;margin:auto;background:#fff;border-radius:28px;padding:38px 30px;text-align:center;border:3px solid var(--g3);box-shadow:0 24px 60px rgba(19,162,63,.25);position:relative}
.ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dark);font-weight:800;padding:6px 22px;border-radius:30px;white-space:nowrap}
.price{font-size:3.4rem;font-weight:800;color:var(--g1);margin:14px 0 6px}
.price small{font-size:1.2rem}
.offer ul{list-style:none;text-align:start;margin:18px 0 22px}
.offer li{padding:7px 0;border-bottom:1px dashed var(--mint2)}
.offer li::before{content:"✔";color:var(--g2);margin-inline-end:10px;font-weight:700}
.timer{display:flex;justify-content:center;gap:10px;margin:16px 0}
.timer div{background:var(--dark);color:#fff;border-radius:12px;padding:8px 12px;min-width:58px}
.timer b{display:block;font-size:1.4rem;color:var(--g3)}
.timer small{font-size:.7rem}
/* reviews */
.stars{color:var(--gold);font-size:1.3rem;letter-spacing:2px}
.rv{background:#fff;border:1px solid var(--mint2);border-radius:18px;padding:20px}
.rv b{color:var(--dark)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);background:var(--mint);padding:26px;border-radius:18px}
.rform{max-width:560px;margin:30px auto 0;background:var(--mint);padding:22px;border-radius:20px}
.star-in{display:flex;gap:4px;justify-content:center;margin-bottom:10px;direction:ltr}
.star-in span{font-size:2rem;cursor:pointer;color:#bcd9c5;transition:.15s}
.star-in span.on{color:var(--gold)}
/* faq */
details{background:#fff;border:1px solid var(--mint2);border-radius:14px;padding:16px 20px;margin-bottom:12px;max-width:800px;margin-inline:auto}
summary{font-weight:700;cursor:pointer;color:var(--dark)}
details p{margin-top:10px;color:var(--muted)}
/* form */
.fbox{max-width:720px;margin:auto;background:#fff;border-radius:26px;padding:34px;box-shadow:0 20px 50px rgba(11,107,44,.15);border:1px solid var(--mint2)}
label{display:block;font-weight:700;margin:14px 0 6px;color:var(--dark);font-size:.92rem}
input,select,textarea{width:100%;padding:13px 15px;border:2px solid var(--mint2);border-radius:12px;font:inherit;background:#fbfffc}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g3)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600;background:var(--mint);padding:8px 14px;border-radius:30px;cursor:pointer;font-size:.85rem}
.checks input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.ok{display:none;margin-top:14px;background:var(--mint2);color:var(--g1);padding:12px;border-radius:12px;text-align:center;font-weight:700}
/* footer */
footer{background:var(--dark);color:#bfe3cb;text-align:center;padding:34px 18px 110px}
footer b{color:#fff}
/* floating */
.fl{position:fixed;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:12px}
.fl.r{right:16px}.fl.l{left:16px}
.fb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:.2s;border:0;cursor:pointer}
.fb:hover{transform:scale(1.12)}
.wa{background:#25d366;animation:pulse 2s infinite}.call{background:#0b6b2c}.gps{background:#1a73e8}.chatb{background:linear-gradient(135deg,var(--g1),var(--g3))}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
/* chat */
#chat{position:fixed;left:16px;bottom:90px;width:320px;max-width:calc(100vw - 32px);background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:70;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--mint2)}
#chat.open{display:flex}
.ch{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px;font-weight:700;display:flex;justify-content:space-between}
.ch span{cursor:pointer}
#cm{height:260px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f4fff7}
.b{padding:9px 13px;border-radius:14px;max-width:85%;font-size:.88rem}
.b.bot{background:#fff;border:1px solid var(--mint2);align-self:flex-start}
.b.me{background:var(--g2);color:#fff;align-self:flex-end}
[dir=rtl] .b.bot{align-self:flex-end}[dir=rtl] .b.me{align-self:flex-start}
.cin{display:flex;border-top:1px solid var(--mint2)}
.cin input{border:0;border-radius:0}
.cin button{border:0;background:var(--g2);color:#fff;padding:0 18px;cursor:pointer;font-size:1.1rem}
/* popup */
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;place-items:center;padding:18px}
#pop.open{display:grid}
.pb{background:#fff;border-radius:24px;padding:34px 28px;text-align:center;max-width:400px;position:relative;border:3px solid var(--g3)}
.pb .x{position:absolute;top:10px;right:16px;font-size:1.6rem;cursor:pointer}
.rev{opacity:0;transform:translateY(30px);transition:.7s}
.rev.show{opacity:1;transform:none}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#top" class="logo"><i>💬</i><span>Herio AI</span></a>
    <nav class="links">
      <a href="#features" data-i="nav1"></a><a href="#how" data-i="nav2"></a><a href="#offer" data-i="nav3"></a><a href="#reviews" data-i="nav4"></a><a href="#contact" data-i="nav5"></a>

        <button data-l="fr"><img src="https://flagcdn.com/w40/fr.png" alt="FR"></button>
        <button data-l="ar"><img src="https://flagcdn.com/w40/ma.png" alt="AR"></button>
        <button data-l="es"><img src="https://flagcdn.com/w40/es.png" alt="ES"></button>
        <button data-l="en"><img src="https://flagcdn.com/w40/gb.png" alt="EN"></button>
      </div>

</section>

<section id="features"><div class="wrap">
  <h2 class="rev" data-i="ft"></h2><p class="sub rev" data-i="fs"></p>
  <div class="grid">
    <div class="card rev"><div class="ic">⏰</div><h3 data-i="f1t"></h3><p data-i="f1d"></p></div>
    <div class="card rev"><div class="ic">🎙️</div><h3 data-i="f2t"></h3><p data-i="f2d"></p></div>

<section class="band" id="how"><div class="wrap">

  <div class="grid">
    <div class="step rev"><div class="num">1</div><h3 data-i="st1"></h3><p data-i="sd1"></p></div>

      <li data-i="o1"></li><li data-i="o2"></li><li data-i="o3"></li><li data-i="o4"></li><li data-i="o5"></li>

    <button class="btn btn-g" style="width:100%;margin-top:12px" onclick="addReview()" data-i="rbtn"></button>

<section id="faq"><div class="wrap">

};
let L='fr',rate=0;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function setLang(l){
  L=l;const t=T[l];
  document.documentElement.lang=l;document.documentElement.dir=t.dir;
  $$('[data-i]').forEach(e=>{if(t[e.dataset.i]!==undefined)e.textContent=t[e.dataset.i]});
  $$('[data-p]').forEach(e=>e.placeholder=t[e.dataset.p]);
  $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  phoneChat();renderReviews();
  $('#cm').innerHTML='';botSay(t.ch0);
  try{localStorage.setItem('hl',l)}catch(e){}
}
$$('#lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function waLink(txt){return 'https://wa.me/'+PHONE+'?text='+encodeURIComponent(txt)}
function openWA(txt){window.open(waLink(txt||T[L].wa),'_blank')}
/* phone animation */
function phoneChat(){
  const box=$('#pm');box.innerHTML='';const t=T[L];
  [['in',t.m1],['out',t.m2],['in',t.m3]].forEach((m,i)=>{
    setTimeout(()=>{const d=document.createElement('div');d.className='m '+m[0];d.textContent=m[1];box.appendChild(d)},600+i*1300);
  });
}
/* counters */
function counters(){$$('[data-count]').forEach(e=>{const n=+e.dataset.count;let c=0;const s=Math.max(1,Math.ceil(n/40));const iv=setInterval(()=>{c=Math.min(n,c+s);e.textContent=c;if(c>=n)clearInterval(iv)},40)})}
/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.12});
$$('.rev').forEach(e=>io.observe(e));
/* timer (24h cycle, resets per visitor session) */
function tick(){
  let end;try{end=+sessionStorage.getItem('end')}catch(e){}
  if(!end||end<Date.now()){end=Date.now()+24*3600*1000;try{sessionStorage.setItem('end',end)}catch(e){}}
  const d=Math.max(0,end-Date.now()),p=n=>String(n).padStart(2,'0');
  $('#th').textContent=p(Math.floor(d/3600000));$('#tm').textContent=p(Math.floor(d%3600000/60000));$('#ts').textContent=p(Math.floor(d%60000/1000));
}
setInterval(tick,1000);tick();
/* reviews: only real ones submitted by visitors (stored in this browser) */
function getR(){try{return JSON.parse(localStorage.getItem('rv')||'[]')}catch(e){return[]}}
function renderReviews(){
  const l=getR(),box=$('#rlist');
  if(!l.length){box.innerHTML='<div class="empty">'+T[L].remp+'</div>';return}
  box.innerHTML=l.map(r=>'<div class="rv"><div class="stars">'+'★'.repeat(r.s)+'☆'.repeat(5-r.s)+'</div><p>'+esc(r.c)+'</p><b>'+esc(r.n)+'</b></div>').join('');
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$$('#sin span').forEach((s,i)=>s.onclick=()=>{rate=i+1;$$('#sin span').forEach((x,j)=>x.classList.toggle('on',j<rate))});
function addReview(){
  const n=$('#rn').value.trim(),c=$('#rc').value.trim();if(!n||!c||!rate)return;
  const l=getR();l.unshift({n,c,s:rate});try{localStorage.setItem('rv',JSON.stringify(l.slice(0,20)))}catch(e){}
  $('#rn').value=$('#rc').value='';rate=0;$$('#sin span').forEach(x=>x.classList.remove('on'));renderReviews();
}
/* form -> WhatsApp */
function sendForm(e){
  e.preventDefault();
  const needs=[...$$('.checks input:checked')].map(x=>x.value).join(', ');
  const msg=`*Nouvelle demande (HerioAi.com)*\nNom: ${$('#fn').value}\nTél: ${$('#fp').value}\nEntreprise: ${$('#fb').value}\nSecteur: ${$('#fs').value}\nBesoins: ${needs||'-'}\nMessage: ${$('#fm').value||'-'}`;
  $('#ok').style.display='block';
  setTimeout(()=>openWA(msg),700);
}
/* AI chat widget (rule-based) -> redirects to WhatsApp */
function toggleChat(){$('#chat').classList.toggle('open')}
function botSay(t,btn){
  const d=document.createElement('div');d.className='b bot';d.textContent=t;
  if(btn){d.appendChild(document.createElement('br'));const a=document.createElement('a');a.href='#';a.textContent=T[L].bw;a.style.cssText='color:#0b6b2c;font-weight:700';a.onclick=ev=>{ev.preventDefault();openWA()};d.appendChild(a)}
  $('#cm').appendChild(d);$('#cm').scrollTop=1e5;
}
function sendChat(){
  const i=$('#ci'),q=i.value.trim();if(!q)return;i.value='';
  const m=document.createElement('div');m.className='b me';m.textContent=q;$('#cm').appendChild(m);
  const low=q.toLowerCase(),t=T[L];
  let a=t.bd;
  if(/prix|tarif|combien|dh|precio|cuanto|cuánto|price|cost|how much|سعر|ثمن|بكم|شحال|درهم/.test(low))a=t.bp;
  else if(/comment|marche|how|cómo|como|funciona|work|كيف|كيفاش/.test(low))a=t.bh;
  setTimeout(()=>botSay(a,true),500);
}
/* exit popup */
let popShown=false;
function closePop(){$('#pop').classList.remove('open')}
function showPop(){if(popShown)return;popShown=true;$('#pop').classList.add('open')}
document.addEventListener('mouseout',e=>{if(e.clientY<5)showPop()});
setTimeout(showPop,45000);
/* init */
let saved='fr';try{saved=localStorage.getItem('hl')||'fr'}catch(e){}
setLang(T[saved]?saved:'fr');counters();
</script>
